[project]
name = "tax-rag"
version = "0.1.0"
description = "Agentic RAG tax chatbot over US/UK tax documents"
requires-python = ">=3.11,<3.12"

dependencies = [
    # LLM: ChatGroq behind core/llm.py. The SDK stays a direct dependency
    # because core/llm.py catches its exceptions. langchain-groq 1.1.3 pins
    # groq<1.0.
    "langchain-groq>=1.1.3",
    "groq>=0.11",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    # ingest
    "pymupdf>=1.24",          # fast text extraction
    "pdfplumber>=0.11",       # table pages -> markdown
    "pyyaml>=6.0",            # manifest.yaml
    # retrieval
    "sentence-transformers>=3.0",   # BAAI/bge-small-en-v1.5, CPU
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    # ui
    "streamlit>=1.37",
    # orchestration: the library only
    "langgraph>=1.2.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# `date.today()` is deliberate: "last year" means the user's local calendar, and
# `today` is resolved once at the edge and passed in (agents/runner.py `run`).
ignore = ["DTZ011"]
